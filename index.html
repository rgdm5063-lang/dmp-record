<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DMP戦績管理</title>

  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --border: #334155;
      --win: #10b981;
      --win-bg: rgba(16, 185, 129, 0.15);
      --lose: #ef4444;
      --lose-bg: rgba(239, 68, 68, 0.15);
      --danger: #dc2626;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-color);
      color: var(--text-main);
      line-height: 1.5;
    }

    header {
      background: #090d16;
      border-bottom: 1px solid var(--border);
      padding: 24px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.05em;
    }

    .nav {
      background: #090d16;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      padding: 0 10px 12px 10px;
      gap: 6px;
      border-bottom: 1px solid var(--border);
    }

    .nav button {
      width: auto;
      margin-top: 0;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 500;
      background: var(--card-bg);
      color: var(--text-sub);
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .nav button:hover {
      background: var(--border);
      color: var(--text-main);
    }

    main {
      max-width: 650px;
      margin: 24px auto;
      padding: 0 16px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 16px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .stat {
      text-align: center;
      padding: 16px 8px;
      background: rgba(15, 23, 42, 0.5);
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .stat .number {
      font-size: 24px;
      font-weight: 700;
      color: var(--text-main);
    }

    .stat .label {
      font-size: 12px;
      color: var(--text-sub);
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    h2 {
      margin-top: 0;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.03em;
    }

    h3 {
      font-size: 15px;
      font-weight: 600;
      margin-top: 24px;
      margin-bottom: 12px;
      border-left: 3px solid var(--accent);
      padding-left: 10px;
      color: var(--text-main);
    }

    label {
      display: block;
      margin-top: 14px;
      margin-bottom: 6px;
      font-weight: 500;
      font-size: 13px;
      color: var(--text-sub);
    }

    input, select {
      width: 100%;
      padding: 10px 14px;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 15px;
      color: var(--text-main);
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, select:focus {
      border-color: var(--accent);
    }

    button {
      width: 100%;
      padding: 12px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
      margin-top: 16px;
    }

    button:hover {
      background: var(--accent-hover);
    }

    button:active {
      opacity: 0.8;
    }

    /* カッコいい削除ボタン */
    .btn-danger {
      background: transparent;
      color: var(--danger);
      border: 1px solid var(--danger);
      padding: 6px 12px;
      font-size: 12px;
      width: auto;
      margin-top: 8px;
      border-radius: 6px;
    }

    .btn-danger:hover {
      background: var(--danger);
      color: white;
    }

    .match-row {
      background: rgba(15, 23, 42, 0.4);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 12px;
    }

    .match-row-grid {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      gap: 10px;
      margin-top: 8px;
    }

    @media (max-width: 500px) {
      .match-row-grid {
        grid-template-columns: 1fr;
      }
    }

    /* 洗練された勝敗トグルボタン */
    .win-lose-group {
      display: flex;
      gap: 6px;
    }

    .win-lose-group button {
      margin-top: 0;
      padding: 8px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #0f172a;
      color: var(--text-sub);
    }

    .win-lose-group button.win.selected-win {
      background: var(--win-bg);
      color: var(--win);
      border-color: var(--win);
    }

    .win-lose-group button.lose.selected-lose {
      background: var(--lose-bg);
      color: var(--lose);
      border-color: var(--lose);
    }

    .matchup {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }

    .matchup:last-child {
      border-bottom: none;
    }

    .empty {
      color: var(--text-sub);
      text-align: center;
      padding: 20px;
      font-size: 14px;
    }

    canvas {
      width: 100% !important;
      height: 300px !important;
      background: #0f172a;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .record-item {
      border-bottom: 1px solid var(--border);
      padding: 16px 0;
    }

    .record-item:last-child {
      border-bottom: none;
    }

    /* バッジデザイン */
    .badge-win {
      display: inline-block;
      padding: 2px 8px;
      font-size: 11px;
      font-weight: 600;
      color: var(--win);
      background: var(--win-bg);
      border-radius: 4px;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .badge-lose {
      display: inline-block;
      padding: 2px 8px;
      font-size: 11px;
      font-weight: 600;
      color: var(--lose);
      background: var(--lose-bg);
      border-radius: 4px;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }
  </style>
</head>

<body>

<header>
  <h1>DMP戦績管理</h1>
</header>

<nav class="nav">
  <button onclick="showPage('home')">ホーム</button>
  <button onclick="showPage('input')">戦績入力</button>
  <button onclick="showPage('records')">戦績一覧</button>
  <button onclick="showPage('matchup')">対面勝率</button>
  <button onclick="showPage('chartView')">勝率グラフ</button>
  <button onclick="showPage('master')">マスタ管理</button>
</nav>

<main>
  <!-- 総合成績 -->
  <div id="home">
    <div class="card">
      <h2>総合成績</h2>
      <div class="stats">
        <div class="stat">
          <div class="number" id="total">0</div>
          <div class="label">試合</div>
        </div>
        <div class="stat">
          <div class="number" id="wins">0</div>
          <div class="label">勝利</div>
        </div>
        <div class="stat">
          <div class="number" id="winrate">0%</div>
          <div class="label">勝率</div>
        </div>
      </div>
    </div>
  </div>

  <!-- 戦績入力 -->
  <div id="input" style="display:none;">
    <div class="card">
      <h2>大会戦績を一括入力</h2>

      <label>大会名</label>
      <select id="tournament">
        <option value="">大会を選択してください</option>
      </select>

      <label>日付</label>
      <input id="date" type="date">

      <label>自分のデッキ</label>
      <select id="myDeck">
        <option value="">自分のデッキを選択してください</option>
      </select>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
        <div>
          <label>予選の回戦数</label>
          <input id="qualRoundCount" type="number" min="0" max="10" value="5">
        </div>
        <div>
          <label>本戦の回戦数</label>
          <input id="finalRoundCount" type="number" min="0" max="6" value="3">
        </div>
      </div>

      <button onclick="generateMatchInputs()" style="margin-top: 20px;">回戦入力欄を作成する</button>
    </div>

    <div id="dynamicInputArea" class="card" style="display:none;">
      <h2>各回戦の結果入力</h2>
      <div id="matchRowsContainer"></div>
      <button onclick="saveAllMatches()" style="background: var(--win); margin-top: 20px;">すべての戦績を保存する</button>
    </div>
  </div>

  <!-- 対面別 -->
  <div id="matchup" style="display:none;" class="card">
    <h2>対面別勝率</h2>
    <div id="matchups">
      <div class="empty">まだ戦績がありません</div>
    </div>
  </div>

  <!-- 勝率グラフ -->
  <div id="chartView" style="display:none;" class="card">
    <h2>時系列勝率推移グラフ</h2>
    <p style="font-size: 13px; color: var(--text-sub); margin-bottom: 16px;">日付順に並べた戦績の累積勝率の推移を表示します。</p>
    <div id="chartContainer">
      <canvas id="winrateChart"></canvas>
    </div>
    <div id="chartLegend" style="margin-top: 12px; font-size: 13px; color: var(--text-sub);"></div>
  </div>

  <!-- 戦績一覧 -->
  <div id="records" style="display:none;" class="card">
    <h2>戦績一覧</h2>
    
    <div style="margin-bottom:16px; padding-bottom:16px; border-bottom:1px solid var(--border);">
      <label>日付で検索</label>
      <input id="searchDate" type="date">

      <label>大会名で検索</label>
      <select id="searchTournament">
        <option value="">すべての大会</option>
      </select>

      <button onclick="searchRecords()">検索</button>
      <button onclick="clearSearch()" style="background:var(--border); color:var(--text-main);">検索をクリア</button>
    </div>

    <div id="recordList"></div>
      
    <!-- バックアップ -->
    <div class="card" style="margin-top:24px; box-shadow:none; background:rgba(15, 23, 42, 0.3);">
      <h2>データバックアップ</h2>
      <button onclick="backupData()" style="background:var(--border); color:var(--text-main);">バックアップファイルを保存</button>
    </div>  

    <!-- データ復元 -->
    <div class="card" style="margin-top:16px; box-shadow:none; background:rgba(15, 23, 42, 0.3);">
      <h2>データ復元</h2>
      <input type="file" id="restoreFile" accept=".json" style="margin-bottom:10px;">
      <button onclick="restoreData()" style="background:var(--border); color:var(--text-main);">バックアップから復元</button>
    </div>
  </div>

  <!-- マスタ管理 -->
  <div id="master" style="display:none;" class="card">
    <h2>マスタ管理</h2>

    <h3>大会マスタ</h3>
    <div>
      <input id="tournamentName" type="text" placeholder="大会名を入力">
      <button onclick="addTournament()">大会を追加</button>
    </div>
    <div id="tournamentMasterList"></div>

    <h3>デッキマスタ</h3>
    <div>
      <input id="deckName" type="text" placeholder="デッキ名を入力">
      <button onclick="addDeck()">デッキを追加</button>
    </div>
    <div id="deckMasterList"></div>
  </div>
</main>

<script>
  let matches = JSON.parse(localStorage.getItem("dmpMatches") || "[]");
  let tournaments = JSON.parse(localStorage.getItem("dmpTournaments") || "[]");
  let decks = JSON.parse(localStorage.getItem("dmpDecks") || "[]");

  function showPage(page) {
    document.getElementById("home").style.display = "none";
    document.getElementById("input").style.display = "none";
    document.getElementById("records").style.display = "none";
    document.getElementById("matchup").style.display = "none";
    document.getElementById("chartView").style.display = "none";
    document.getElementById("master").style.display = "none";
    
    document.getElementById(page).style.display = "block";

    if (page === 'chartView') {
      setTimeout(drawWinrateChart, 50);
    }
  }

  function addDeck() {
    const input = document.getElementById("deckName");
    const name = input.value.trim();

    if (!name) {
      alert("デッキ名を入力してください");
      return;
    }

    if (decks.includes(name)) {
      alert("そのデッキはすでに登録されています");
      return;
    }

    decks.push(name);
    localStorage.setItem("dmpDecks", JSON.stringify(decks));
    input.value = "";
    renderDeckMaster();
    updateSelects();
  }

  function renderDeckMaster() {
    const list = document.getElementById("deckMasterList");
    if (decks.length === 0) {
      list.innerHTML = '<div class="empty">デッキが登録されていません</div>';
      return;
    }
    list.innerHTML = decks.map(function(name, index) {
      return `
        <div style="margin: 10px 0; display:flex; justify-content:space-between; align-items:center;">
          <span style="font-size:14px;">${name}</span>
          <button class="btn-danger" onclick="deleteDeck(${index})">削除</button>
        </div>
      `;
    }).join("");
  }

  function deleteDeck(index) {
    const ok = confirm("「" + decks[index] + "」を削除しますか？");
    if (!ok) return;

    decks.splice(index, 1);
    localStorage.setItem("dmpDecks", JSON.stringify(decks));
    renderDeckMaster();
    updateSelects();
  }

  function addTournament() {
    const input = document.getElementById("tournamentName");
    const name = input.value.trim();

    if (!name) {
      alert("大会名を入力してください");
      return;
    }

    if (tournaments.includes(name)) {
      alert("その大会はすでに登録されています");
      return;
    }

    tournaments.push(name);
    localStorage.setItem("dmpTournaments", JSON.stringify(tournaments));
    input.value = "";
    renderTournamentMaster();
    updateSelects();
  }

  function renderTournamentMaster() {
    const list = document.getElementById("tournamentMasterList");
    if (tournaments.length === 0) {
      list.innerHTML = '<div class="empty">大会が登録されていません</div>';
      return;
    }
    list.innerHTML = tournaments.map(function(name, index) {
      return `
        <div style="margin: 10px 0; display:flex; justify-content:space-between; align-items:center;">
          <span style="font-size:14px;">${name}</span>
          <button class="btn-danger" onclick="deleteTournament(${index})">削除</button>
        </div>
      `;
    }).join("");
  }

  function deleteTournament(index) {
    const ok = confirm("「" + tournaments[index] + "」を削除しますか？");
    if (!ok) return;

    tournaments.splice(index, 1);
    localStorage.setItem("dmpTournaments", JSON.stringify(tournaments));
    renderTournamentMaster();
    updateSelects();
  }

  function updateSelects() {
    const tournamentSelect = document.getElementById("tournament");
    if (tournamentSelect) {
      tournamentSelect.innerHTML = '<option value="">大会を選択してください</option>' +
        tournaments.map(name => `<option value="${name}">${name}</option>`).join("");
    }

    const myDeckSelect = document.getElementById("myDeck");
    if (myDeckSelect) {
      myDeckSelect.innerHTML = '<option value="">自分のデッキを選択してください</option>' +
        decks.map(name => `<option value="${name}">${name}</option>`).join("");
    }

    const searchTournament = document.getElementById("searchTournament");
    if (searchTournament) {
      searchTournament.innerHTML = '<option value="">すべての大会</option>' +
        tournaments.map(name => `<option value="${name}">${name}</option>`).join("");
    }
  }

  function generateMatchInputs() {
    const qualCount = parseInt(document.getElementById("qualRoundCount").value) || 0;
    const finalCount = parseInt(document.getElementById("finalRoundCount").value) || 0;
    const container = document.getElementById("matchRowsContainer");
    const dynamicArea = document.getElementById("dynamicInputArea");

    if (qualCount === 0 && finalCount === 0) {
      alert("予選または本戦の回戦数を1以上に設定してください。");
      return;
    }

    let html = "";

    if (qualCount > 0) {
      html += `<h3>予選ラウンド (${qualCount}回戦)</h3>`;
      for (let i = 1; i <= qualCount; i++) {
        html += createMatchRowHTML("予選", i);
      }
    }

    if (finalCount > 0) {
      html += `<h3>本戦トーナメント (${finalCount}回戦)</h3>`;
      for (let i = 1; i <= finalCount; i++) {
        html += createMatchRowHTML("本戦", i);
      }
    }

    container.innerHTML = html;
    dynamicArea.style.display = "block";
    dynamicArea.scrollIntoView({ behavior: 'smooth' });
  }

  function createMatchRowHTML(phase, roundNum) {
    let deckOptions = '<option value="">相手のデッキ選択</option>' +
      decks.map(name => `<option value="${name}">${name}</option>`).join("");

    return `
      <div class="match-row" data-phase="${phase}" data-round="${roundNum}">
        <div style="font-weight:600; margin-bottom:6px; font-size:13px; color:var(--text-sub);">${phase} ${roundNum}回戦</div>
        <div class="match-row-grid">
          <div>
            <select class="row-opponent">
              ${deckOptions}
            </select>
          </div>
          <div>
            <select class="row-firstsecond">
              <option value="先攻">先攻</option>
              <option value="後攻">後攻</option>
              <option value="先後未選択">先後未選択</option>
            </select>
          </div>
          <div class="win-lose-group">
            <button type="button" class="win" onclick="setRowResult(this, 'win')">勝利</button>
            <button type="button" class="lose" onclick="setRowResult(this, 'lose')">敗北</button>
          </div>
        </div>
      </div>
    `;
  }

  function setRowResult(btn, result) {
    const parentGroup = btn.parentElement;
    const winBtn = parentGroup.querySelector('.win');
    const loseBtn = parentGroup.querySelector('.lose');

    winBtn.classList.remove('selected-win');
    loseBtn.classList.remove('selected-lose');

    parentGroup.dataset.result = result;

    if (result === 'win') {
      winBtn.classList.add('selected-win');
    } else {
      loseBtn.classList.add('selected-lose');
    }
  }

  function saveAllMatches() {
    const tournament = document.getElementById("tournament").value;
    const date = document.getElementById("date").value;
    const myDeck = document.getElementById("myDeck").value;

    const rowElements = document.querySelectorAll(".match-row");
    const newMatches = [];

    for (let row of rowElements) {
      const phase = row.dataset.phase;
      const round = row.dataset.round;
      const opponent = row.querySelector(".row-opponent").value;
      const firstSecond = row.querySelector(".row-firstsecond").value;
      const result = row.querySelector(".win-lose-group").dataset.result;

      if (opponent || result) {
        if (!opponent) {
          alert(`${phase} ${round}回戦の相手デッキが未選択です。`);
          return;
        }
        if (!result) {
          alert(`${phase} ${round}回戦の勝利・敗北が選択されていません。`);
          return;
        }

        newMatches.push({
          tournament: tournament || "大会名なし",
          date: date || "1970-01-01",
          myDeck: myDeck || "未選択",
          opponent,
          result,
          firstSecond: `${phase}${round}回戦・${firstSecond}`
        });
      }
    }

    if (newMatches.length === 0) {
      alert("保存する戦績データが入力されていません。");
      return;
    }

    matches.push(...newMatches);
    localStorage.setItem("dmpMatches", JSON.stringify(matches));

    updateDisplay();

    document.getElementById("dynamicInputArea").style.display = "none";
    alert(newMatches.length + "件の戦績を保存しました！");
    showPage("records");
  }

  function drawWinrateChart() {
    const canvas = document.getElementById("winrateChart");
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    
    const width = canvas.parentElement.clientWidth || 600;
    const height = 300;
    canvas.width = width * window.devicePixelRatio;
    canvas.height = height * window.devicePixelRatio;
    ctx.scale(window.devicePixelRatio, window.devicePixelRatio);

    ctx.clearRect(0, 0, width, height);

    if (matches.length === 0) {
      ctx.fillStyle = "#94a3b8";
      ctx.font = "14px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("データがありません", width / 2, height / 2);
      const legend = document.getElementById("chartLegend");
      if (legend) legend.innerHTML = "";
      return;
    }

    const sortedMatches = [...matches].sort((a, b) => {
      const dateA = a.date || "1970-01-01";
      const dateB = b.date || "1970-01-01";
      return dateA.localeCompare(dateB);
    });

    let totalWins = 0;
    const points = sortedMatches.map((match, index) => {
      if (match.result === "win") totalWins++;
      const rate = ((totalWins / (index + 1)) * 100);
      return {
        xIndex: index,
        rate: rate,
        date: match.date || "日付なし",
        tournament: match.tournament || "大会名なし"
      };
    });

    const padding = 40;
    const graphWidth = width - padding * 2;
    const graphHeight = height - padding * 2;

    ctx.strokeStyle = "#334155";
    ctx.lineWidth = 1;
    ctx.font = "11px sans-serif";
    ctx.fillStyle = "#94a3b8";
    ctx.textAlign = "right";

    for (let i = 0; i <= 4; i++) {
      const rateVal = i * 25;
      const y = padding + graphHeight - (graphHeight * (rateVal / 100));
      
      ctx.beginPath();
      ctx.moveTo(padding, y);
      ctx.lineTo(width - padding, y);
      ctx.stroke();

      ctx.fillText(rateVal + "%", padding - 8, y + 4);
    }

    if (points.length === 1) {
      const x = padding + graphWidth / 2;
      const y = padding + graphHeight - (graphHeight * (points[0].rate / 100));
      ctx.fillStyle = "#3b82f6";
      ctx.beginPath();
      ctx.arc(x, y, 5, 0, Math.PI * 2);
      ctx.fill();
      const legend = document.getElementById("chartLegend");
      if (legend) legend.innerHTML = `全 ${points.length} 試合の累積勝率推移`;
      return;
    }

    ctx.strokeStyle = "#3b82f6";
    ctx.lineWidth = 2.5;
    ctx.beginPath();

    points.forEach((pt, i) => {
      const x = padding + (graphWidth / (points.length - 1)) * i;
      const y = padding + graphHeight - (graphHeight * (pt.rate / 100));

      if (i === 0) {
        ctx.moveTo(x, y);
      } else {
        ctx.lineTo(x, y);
      }
    });
    ctx.stroke();

    points.forEach((pt, i) => {
      const x = padding + (graphWidth / (points.length - 1)) * i;
      const y = padding + graphHeight - (graphHeight * (pt.rate / 100));

      ctx.fillStyle = "#1e293b";
      ctx.strokeStyle = "#3b82f6";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(x, y, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
    });

    const legend = document.getElementById("chartLegend");
    if (legend) {
      legend.innerHTML = `総試合数: <strong>${points.length}試合</strong> ／ 最終累積勝率: <strong>${points[points.length - 1].rate.toFixed(1)}%</strong>`;
    }
  }

  function renderRecords(data = matches) {
    const recordList = document.getElementById("recordList");
    if (!recordList) return;

    if (data.length === 0) {
      recordList.innerHTML = '<div class="empty">まだ戦績がありません</div>';
      return;
    }

    recordList.innerHTML = "";

    data.forEach((match) => {
      const originalIndex = matches.indexOf(match);
      const div = document.createElement("div");
      div.className = "record-item";

      let resultBadge = match.result === "win" 
        ? '<span class="badge-win">勝利</span>' 
        : '<span class="badge-lose">敗北</span>';

      div.innerHTML = `
        <div style="font-weight: 600; font-size: 15px; margin-bottom: 2px;">${match.tournament}</div>
        <div style="font-size: 13px; color: var(--text-sub); margin-bottom: 6px;">${match.date || "日付なし"}</div>
        <div style="font-size: 14px; margin-bottom: 6px;"><strong>${match.myDeck}</strong> vs <strong>${match.opponent}</strong></div>
        <div style="display: flex; align-items: center; gap: 10px; font-size: 13px;">
          ${resultBadge}
          <span style="color: var(--text-sub);">${match.firstSecond || ""}</span>
        </div>
        <button class="btn-danger" onclick="deleteMatch(${originalIndex})">削除</button>
      `;
      recordList.appendChild(div);
    });
  }

  function updateDisplay() {
    const total = matches.length;
    const wins = matches.filter(match => match.result === "win").length;
    const winrate = total === 0 ? 0 : ((wins / total) * 100).toFixed(1);

    const totalEl = document.getElementById("total");
    const winsEl = document.getElementById("wins");
    const winrateEl = document.getElementById("winrate");

    if (totalEl) totalEl.textContent = total;
    if (winsEl) winsEl.textContent = wins;
    if (winrateEl) winrateEl.textContent = winrate + "%";

    const matchupData = {};
    matches.forEach(match => {
      if (!matchupData[match.opponent]) {
        matchupData[match.opponent] = { wins: 0, total: 0 };
      }
      matchupData[match.opponent].total++;
      if (match.result === "win") {
        matchupData[match.opponent].wins++;
      }
    });

    const container = document.getElementById("matchups");
    if (container) {
      if (Object.keys(matchupData).length === 0) {
        container.innerHTML = '<div class="empty">まだ戦績がありません</div>';
      } else {
        container.innerHTML = "";
        Object.entries(matchupData).forEach(([opponent, data]) => {
          const rate = ((data.wins / data.total) * 100).toFixed(1);
          const div = document.createElement("div");
          div.className = "matchup";
          div.innerHTML = `
            <div>
              <div style="font-weight: 600; font-size: 14px;">${opponent}</div>
              <div style="font-size: 12px; color: var(--text-sub);">${data.wins}勝 ${data.total - data.wins}敗</div>
            </div>
            <div style="font-weight: 700; font-size: 16px;">${rate}%</div>
          `;
          container.appendChild(div);
        });
      }
    }

    renderRecords();
  }

  function searchRecords() {
    const searchDate = document.getElementById("searchDate").value;
    const searchTournament = document.getElementById("searchTournament").value;

    const filteredMatches = matches.filter(function(match) {
      const dateOK = !searchDate || match.date === searchDate;
      const tournamentOK = !searchTournament || match.tournament === searchTournament;
      return dateOK && tournamentOK;
    });

    renderRecords(filteredMatches);
  }

  function clearSearch() {
    document.getElementById("searchDate").value = "";
    document.getElementById("searchTournament").value = "";
    renderRecords(matches);
  }

  function deleteMatch(index) {
    const ok = confirm("この戦績を削除しますか？");
    if (!ok) return;

    matches.splice(index, 1);
    localStorage.setItem("dmpMatches", JSON.stringify(matches));
    updateDisplay();
  }

  function backupData() {
    const backupObj = {
      matches: matches,
      tournaments: tournaments,
      decks: decks
    };
    const data = JSON.stringify(backupObj, null, 2);
    const blob = new Blob([data], { type: "application/json" });
    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = "dmp-backup-" + new Date().toISOString().slice(0, 10) + ".json";
    a.click();
    URL.revokeObjectURL(url);
  }

  function restoreData() {
    const fileInput = document.getElementById("restoreFile");
    const file = fileInput.files[0];

    if (!file) {
      alert("バックアップファイルを選択してください");
      return;
    }

    const reader = new FileReader();
    reader.onload = function(event) {
      try {
        const restored = JSON.parse(event.target.result);
        let restoredMatches = [];
        let restoredTournaments = tournaments;
        let restoredDecks = decks;

        if (Array.isArray(restored)) {
          restoredMatches = restored;
        } else if (restored && Array.isArray(restored.matches)) {
          restoredMatches = restored.matches;
          if (Array.isArray(restored.tournaments)) restoredTournaments = restored.tournaments;
          if (Array.isArray(restored.decks)) restoredDecks = restored.decks;
        } else {
          alert("正しいバックアップファイルではありません。");
          return;
        }

        const ok = confirm(
          restoredMatches.length + "件の戦績データを復元します。\n現在のデータは上書きされます。よろしいですか？"
        );

        if (!ok) return;

        matches = restoredMatches;
        tournaments = restoredTournaments;
        decks = restoredDecks;

        localStorage.setItem("dmpMatches", JSON.stringify(matches));
        localStorage.setItem("dmpTournaments", JSON.stringify(tournaments));
        localStorage.setItem("dmpDecks", JSON.stringify(decks));

        renderDeckMaster();
        renderTournamentMaster();
        updateSelects();
        updateDisplay();

        alert("データを復元しました！");
      } catch (error) {
        alert("バックアップファイルを読み込めませんでした。");
      }
    };
    reader.readAsText(file);
  }

  renderDeckMaster();
  renderTournamentMaster();
  updateSelects();
  updateDisplay();
</script>

</body>
</html>
